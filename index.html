<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>奶蛙逃亡</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17140d;color:#fff;font-family:system-ui,"Microsoft YaHei",sans-serif}button{font:inherit}
    #game{display:block;width:100%;height:100%;touch-action:none;background:#b9e9ff}
    .hud{position:fixed;inset:0;pointer-events:none;padding:max(18px,env(safe-area-inset-top)) 20px 20px;display:flex;align-items:flex-start;justify-content:space-between;text-shadow:0 2px 4px #0008}
    .score{font-size:clamp(22px,4vw,36px);font-weight:900;line-height:1}.score small{display:block;margin-top:8px;font-size:13px;letter-spacing:2px;color:#fff9ad}.milk{display:flex;align-items:center;gap:7px;font-size:20px;font-weight:800;background:#251c12bb;border:2px solid #f7d553;border-radius:999px;padding:7px 14px}.milk img{width:22px;height:32px;object-fit:contain}
    .screen{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:linear-gradient(#071c2488,#151008dd);text-align:center}.screen[hidden]{display:none}.card{width:min(470px,100%);padding:32px 24px;border:1px solid #fff3;border-radius:28px;background:#20170ee8;box-shadow:0 20px 70px #0008;backdrop-filter:blur(12px)}
    h1{margin:0;font-size:clamp(48px,13vw,78px);line-height:.9;color:#ffdf35;text-shadow:0 5px 0 #8b501b,0 9px 18px #000}.tag{margin:22px 0;color:#f7e9ce;font-weight:700}.tip{margin:18px 0 0;color:#cdbfa9;font-size:14px;line-height:1.8}.start{pointer-events:auto;border:0;border-radius:999px;padding:14px 34px;color:#2a1a0c;background:#ffdc38;font-size:20px;font-weight:900;box-shadow:0 6px 0 #b96a20;cursor:pointer}.start:active{transform:translateY(4px);box-shadow:0 2px 0 #b96a20}.best{margin:12px 0 22px;color:#fff4ba;font-weight:800}
    .controls{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:none;gap:12px;pointer-events:auto}.controls button{width:58px;height:58px;border:1px solid #fff5;border-radius:50%;background:#21180dbb;color:#fff;font-size:26px;backdrop-filter:blur(6px)}
    .calibrate{pointer-events:auto;position:fixed;right:18px;bottom:max(86px,calc(env(safe-area-inset-bottom) + 68px));border:1px solid #fff4;border-radius:999px;padding:8px 12px;background:#17130dbb;color:#fff;font-weight:800}
    @media (pointer:coarse){body.sensor-fallback .controls{display:flex}}
  </style>
</head>
<body>
  <canvas id="game" aria-label="奶蛙逃亡游戏画面"></canvas>
  <div class="hud" id="hud" hidden><div class="score"><span id="score">0</span><small>逃亡积分 · <span id="combo">×1</span></small></div><div class="milk"><img src="assets/cartoon-water-bottle.png" alt="">大水 <span id="milk">0</span></div></div>
  <div class="controls" id="controls"><button data-key="left" aria-label="向左">←</button><button data-key="up" aria-label="跳跃">↑</button><button data-key="down" aria-label="下滑">↓</button><button data-key="right" aria-label="向右">→</button></div>
  <button class="calibrate" id="calibrate" hidden>校准倾斜</button>
  <div class="screen" id="intro"><div class="card"><h1>奶蛙<br>逃亡</h1><p class="tag">别让高雅人士追上你！</p><button class="start" id="start">开始逃亡</button><p class="tip">手机左右倾斜控制位置<br>上滑跳跃 · 下滑俯身 · 左右滑转弯</p></div></div>
  <div class="screen" id="over" hidden><div class="card"><h1>被逮住了</h1><p class="best" id="result"></p><button class="start" id="again">再跑一次</button></div></div>
  <script>
    const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
    const frog=new Image(),hunter=new Image(),water=new Image(); frog.src='assets/milk-frog-run-sheet.png'; hunter.src='assets/gentleman-run-sheet.png'; water.src='assets/cartoon-water-bottle.png';
    const $=s=>document.querySelector(s), hud=$('#hud'), intro=$('#intro'), over=$('#over'), scoreEl=$('#score'), milkEl=$('#milk'),comboEl=$('#combo');
    let W,H,DPR,state='intro',last=0,startTime=0,score=0,bonus=0,milks=0,combo=0,lane=0,targetLane=0,jump=0,slide=0,stumble=0,speed=1,spawn=0,shake=0,chase=0,bend=0,turnCooldown=7,turnAnim=0,junction=null,objects=[],touch=null,tilt=0,tiltCenter=null,tiltActive=false,sensorListening=false,patternIndex=0,audio,cornerTurn=null;
    const keys=new Set(),rand=n=>Math.floor(Math.random()*n),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
    const tiltLane=(value,center)=>{const d=value-center,a=Math.abs(d);return a<3?0:clamp(Math.sign(d)*(a-3)/17,-1,1)};
    const obstacleHits=(type,airborne,sliding)=>type==='rock'||((type==='root'||type==='gap')&&!airborne)||(type==='branch'&&!sliding);
    function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
    function readTilt(e){const angle=screen.orientation?.angle??window.orientation??0,value=angle===90?e.beta:angle===270||angle===-90?-e.beta:e.gamma;if(value==null)return;tilt=value;if(tiltCenter==null)tiltCenter=value;tiltActive=true;$('#calibrate').hidden=false}
    async function enableTilt(){if(sensorListening)return true;if(!('DeviceOrientationEvent'in window))return false;try{if(typeof DeviceOrientationEvent.requestPermission==='function'&&await DeviceOrientationEvent.requestPermission()!=='granted')return false;addEventListener('deviceorientation',readTilt,true);sensorListening=true;return true}catch(e){console.warn('方向传感器不可用',e);return false}}
    function sound(freq,duration=.07,volume=.025){try{const AC=window.AudioContext||window.webkitAudioContext;audio??=new AC();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+duration);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}}
    async function reset(){const hasSensor=await enableTilt();document.body.classList.toggle('sensor-fallback',!hasSensor);tiltCenter=null;state='play';last=performance.now();startTime=last;score=bonus=milks=combo=lane=targetLane=jump=slide=stumble=spawn=shake=chase=bend=turnAnim=patternIndex=0;turnCooldown=7;junction=null;cornerTurn=null;speed=1;objects=[];hud.hidden=false;intro.hidden=over.hidden=true;requestAnimationFrame(loop)}
    function action(a){if(state!=='play'||cornerTurn)return;if((a==='left'||a==='right')&&junction&&junction.z<.42){if(a!==junction.dir)return end('拐错方向，掉进遗迹了');cornerTurn={dir:a==='left'?-1:1,elapsed:0,z:junction.z};objects=[];targetLane=0;bonus+=200*Math.max(1,Math.floor(combo/5)+1);sound(180,.12,.04);navigator.vibrate?.(30);return}if(a==='left')targetLane=clamp(targetLane-.38,-1,1);if(a==='right')targetLane=clamp(targetLane+.38,-1,1);if(a==='up'&&!jump){jump=1;slide=0;sound(330)}if(a==='down'&&!slide){slide=1;setTimeout(()=>slide=0,650)}}
    addEventListener('keydown',e=>{const k={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',' ':'up',ArrowDown:'down',s:'down'}[e.key];if(k){e.preventDefault();if(!keys.has(k))action(k);keys.add(k)}});addEventListener('keyup',e=>{const k={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',' ':'up',ArrowDown:'down',s:'down'}[e.key];keys.delete(k)});
    function swipe(e,minimum){if(!touch)return false;const dx=e.clientX-touch[0],dy=e.clientY-touch[1];if(Math.hypot(dx,dy)<minimum)return false;action(Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down'));touch=null;return true}
    canvas.addEventListener('pointerdown',e=>touch=[e.clientX,e.clientY]);canvas.addEventListener('pointermove',e=>swipe(e,28));canvas.addEventListener('pointerup',e=>swipe(e,18));
    $('#controls').onclick=e=>e.target.dataset.key&&action(e.target.dataset.key);$('#calibrate').onclick=()=>tiltCenter=tilt;$('#start').onclick=$('#again').onclick=reset;addEventListener('resize',resize);addEventListener('orientationchange',()=>tiltCenter=null);resize();
    function roadX(depth,which){const p=1-depth,half=W*(.28+.28*p);return W/2+(bend*.16+turnAnim*.52)*W*depth+which*.5*half}
    const patterns=['block','jump','duck','gap','mixed'],lanes=[-1,0,1];
    function addObject(type,lane,z){objects.push({type,lane,z,hit:false})}
    function spawnObject(){
      const mode=patterns[patternIndex++%patterns.length],safe=lanes[rand(3)],blocked=lanes.filter(l=>l!==safe);
      if(mode==='block')blocked.forEach(l=>addObject('rock',l,1));
      if(mode==='jump')lanes.forEach(l=>addObject('root',l,1));
      if(mode==='duck')lanes.forEach(l=>addObject('branch',l,1));
      if(mode==='gap')blocked.forEach(l=>addObject('gap',l,1));
      if(mode==='mixed'){addObject('rock',blocked[0],1);addObject('gap',blocked[1],1)}
      for(let i=0;i<5;i++)addObject('milk',safe,1.03+i*.13);
    }
    function update(dt,now){if(cornerTurn){cornerTurn.elapsed=Math.min(.65,cornerTurn.elapsed+dt);turnAnim=cornerTurn.dir*Math.sin(cornerTurn.elapsed/.65*Math.PI)*.35;lane*=Math.max(0,1-dt*12);if(cornerTurn.elapsed>=.65){cornerTurn=null;junction=null;turnAnim=0;spawn=1.8;turnCooldown=8+Math.random()*3;bend=0}return}speed=1+Math.min(1.6,(now-startTime)/65000);score=Math.floor((now-startTime)/55)+bonus;bend=Math.sin(score*.006)*.75;if(!junction||junction.z>.42){if(tiltActive&&tiltCenter!=null)targetLane+=(tiltLane(tilt,tiltCenter)-targetLane)*Math.min(1,dt*10);else{if(keys.has('left'))targetLane-=dt*1.8;if(keys.has('right'))targetLane+=dt*1.8;targetLane=clamp(targetLane,-1,1)}}lane+=(targetLane-lane)*Math.min(1,dt*9);chase=Math.max(0,chase-dt*.16);stumble=Math.max(0,stumble-dt*2.4);turnAnim*=Math.max(0,1-dt*2.8);if(jump){jump+=dt*1.55;if(jump>=2){jump=0;shake=Math.max(shake,4);navigator.vibrate?.(12)}}if(!junction){turnCooldown-=dt*speed;if(turnCooldown<=0){junction={dir:Math.random()<.5?'left':'right',z:1};objects=objects.filter(o=>o.z<.5)}}else{junction.z-=dt*.48*speed;if(junction.z<.02)return end('没转弯，冲出了遗迹')}spawn-=dt*speed;if(spawn<=0&&!junction){spawnObject();spawn=1.15+Math.random()*.28}for(const o of objects){o.z-=dt*.48*speed;if(o.type==='milk'&&o.z<0&&!o.hit)combo=0;if(o.z<.09&&!o.hit&&Math.abs(lane-o.lane)<.36){const airborne=jump>0;if(o.type==='milk'){milks++;combo++;bonus+=10*Math.max(1,Math.floor(combo/5)+1);o.hit=true;sound(620+Math.min(combo,8)*35,.05,.018);navigator.vibrate?.(8)}else{o.hit=true;if(obstacleHits(o.type,airborne,slide)){combo=0;shake=22;stumble=1;sound(75,.18,.06);navigator.vibrate?.([70,30,70]);if(chase>.45)return end('高雅人士抓住了你');chase=1}}}}objects=objects.filter(o=>o.z>-.08&&!o.hit);shake*=.84;scoreEl.textContent=score.toLocaleString();milkEl.textContent=milks;comboEl.textContent='×'+Math.max(1,Math.floor(combo/5)+1)}
    function end(reason='高雅人士抓住了你'){state='over';hud.hidden=true;over.hidden=false;const best=Math.max(score,+localStorage.milkFrogBest||0);localStorage.milkFrogBest=best;$('#over h1').textContent=reason;$('#result').textContent=`积分 ${score} · 喝到 ${milks} 瓶大水　最佳 ${best}`}
    function drawSprite(img,sx,sy,sw,sh,x,y,w,h){ctx.save();ctx.beginPath();ctx.roundRect(x-w/2,y-h,w,h,w*.18);ctx.clip();ctx.drawImage(img,sx,sy,sw,sh,x-w/2,y-h,w,h);ctx.restore()}
    function drawFrame(img,frame,x,y,w,h){if(!img.naturalWidth)return;const sw=img.naturalWidth/4,sh=img.naturalHeight/2;ctx.drawImage(img,(frame%4)*sw,Math.floor(frame/4)*sh,sw,sh,x-w/2,y-h,w,h)}
    // Local world coordinates for the bridge; clip faces at the camera near plane.
    function cornerCamera(){
      const d=cornerTurn?cornerTurn.dir:(junction.dir==='left'?-1:1);
      const u=cornerTurn?clamp(cornerTurn.elapsed/.65,0,1):0,e=u*u*(3-2*u);
      const distance=cornerTurn?cornerTurn.z*30+2:junction.z*30+2;
      return {d,e,x:d*e*5,z:e*distance-5*(1-e),yaw:d*e*Math.PI/2,distance};
    }
    function cornerView(point,c){const x=point[0]-c.x,z=point[2]-c.z;return [x*Math.cos(c.yaw)-z*Math.sin(c.yaw),point[1],x*Math.sin(c.yaw)+z*Math.cos(c.yaw)+6]}
    function cornerProject(p,horizon){const f=W*.85;return [W/2+p[0]*f/p[2],horizon+(3.8-p[1])*H*.8/p[2]]}
    function cornerFace(points,color,c,horizon){
      const vertices=points.map(p=>cornerView(p,c)),clipped=[];
      for(let i=0;i<vertices.length;i++){const a=vertices[i],b=vertices[(i+1)%vertices.length],inside=a[2]>.7,next=b[2]>.7;if(inside)clipped.push(a);if(inside!==next){const t=(.7-a[2])/(b[2]-a[2]);clipped.push(a.map((v,k)=>v+(b[k]-v)*t))}}
      if(clipped.length<3)return;ctx.beginPath();clipped.forEach((p,i)=>{const q=cornerProject(p,horizon);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#2c3025';ctx.lineWidth=1;ctx.stroke();
    }
    function drawCorner(horizon){
      const c=cornerCamera(),j=c.distance,d=c.d;
      const mist=ctx.createLinearGradient(0,horizon,0,H);mist.addColorStop(0,'#214b3c');mist.addColorStop(1,'#091e1b');ctx.fillStyle=mist;ctx.fillRect(0,horizon,W,H-horizon);
      const faces=[];
      function face(p,color){faces.push({p,color,z:p.reduce((s,v)=>s+cornerView(v,c)[2],0)/p.length})}
      function tile(x1,z1,x2,z2,i){face([[x1,-.65,z1],[x2,-.65,z1],[x2,0,z1],[x1,0,z1]],'#494b39');face([[x1,0,z1],[x2,0,z1],[x2,0,z2],[x1,0,z2]],i%2?'#8d8564':'#7c775b')}
      for(let z=-8;z<j-3;z+=2){const end=Math.min(z+2,j-3);tile(-3,z,3,end,Math.floor(z/2));for(const x of[-3.2,3])face([[x,0,z],[x+.2,0,z],[x+.2,.5,end],[x,.5,end]],'#b1a47b')}
      tile(-3,j-3,3,j+3,0);
      for(let s=3;s<65;s+=2){const x=d*s,n=d*(s+2);tile(Math.min(x,n),j-3,Math.max(x,n),j+3,s);for(const edge of[-3,3])face([[x,0,j+edge],[n,0,j+edge],[n,.5,j+edge],[x,.5,j+edge]],'#a99d75')}
      face([[-3,0,j+3],[3,0,j+3],[3,1.1,j+3],[-3,1.1,j+3]],'#686b53');
      const torches=[[-3,j-3],[3,j+3]];for(let s=9;s<45;s+=10)torches.push([d*s,j-3],[d*s,j+3]);
      for(const [x,z]of torches){face([[x-.17,0,z],[x+.17,0,z],[x+.17,1.7,z],[x-.17,1.7,z]],'#514632');face([[x-.25,1.7,z],[x+.25,1.7,z],[x+.1,2.35,z],[x-.1,2.35,z]],'#ffc350')}
      faces.sort((a,b)=>b.z-a.z).forEach(f=>cornerFace(f.p,f.color,c,horizon));
      if(!cornerTurn){ctx.fillStyle='#fff1b7';ctx.textAlign='center';ctx.font='800 18px system-ui';ctx.fillText(junction.z<.42?(d<0?'向左滑动转弯':'向右滑动转弯'):'前方石桥转弯',W/2,H*.18)}
    }
    function draw(){
      const t=performance.now()/1000,horizon=H*(.26-(speed-1)*.012);ctx.save();ctx.translate((Math.random()-.5)*shake,Math.sin(t*12*speed)*H*.0015+(Math.random()-.5)*shake);
      const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#082b2b');sky.addColorStop(.34,'#46795a');sky.addColorStop(1,'#172518');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#f7c65a44';ctx.beginPath();ctx.arc(W/2,horizon*.7,W*.18,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#214b35';for(let i=0;i<13;i++){const x=i*W/12+(bend+turnAnim)*W*.025,r=W*(.035+(i%3)*.012);ctx.beginPath();ctx.arc(x,horizon*.86,r,0,Math.PI*2);ctx.fill()}
      ctx.fillStyle='#153d2d';for(let i=0;i<10;i++){const x=i*W/9+(bend+turnAnim)*W*.055,r=W*(.06+(i%3)*.02);ctx.beginPath();ctx.arc(x,horizon,r,0,Math.PI*2);ctx.fill()}
      const far=W/2+(bend*.16+turnAnim*.52)*W;ctx.fillStyle='#263b27';ctx.beginPath();ctx.moveTo(far-W*.29,horizon);ctx.lineTo(W*.04,H);ctx.lineTo(W*.96,H);ctx.lineTo(far+W*.29,horizon);ctx.fill();
      const floor=ctx.createLinearGradient(0,horizon,0,H);floor.addColorStop(0,'#82754f');floor.addColorStop(1,'#403c2a');ctx.fillStyle=floor;ctx.beginPath();ctx.moveTo(far-W*.26,horizon);ctx.lineTo(W*.08,H);ctx.lineTo(W*.92,H);ctx.lineTo(far+W*.26,horizon);ctx.fill();
      ctx.strokeStyle='rgba(48,42,27,.3)';ctx.lineWidth=2;for(const split of[-.5,.5]){ctx.beginPath();for(let i=0;i<=12;i++){const z=1-i/12,p=1-z,x=roadX(z,split),y=horizon+(H-horizon)*p*p;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}
      for(let i=0;i<13;i++){const z=(i/13-(t*speed*.22)%1+1)%1,p=1-z,y=horizon+(H-horizon)*p*p,half=W*(.26+.2*p),cx=roadX(z,0);ctx.strokeStyle=`rgba(215,190,125,${.08+p*.2})`;ctx.lineWidth=1+p*4;ctx.beginPath();ctx.moveTo(cx-half,y);ctx.lineTo(cx+half,y);ctx.stroke()}
      for(let side of[-1,1])for(let i=0;i<6;i++){const z=(i*.19-(t*.13)%1+1)%1,p=1-z,y=horizon+(H-horizon)*p*p,s=12+p*118,x=roadX(z,0)+side*(W*(.31+.37*p));ctx.fillStyle='#142c20';ctx.fillRect(x-s*.13,y-s,s*.26,s);ctx.fillStyle=i%3?'#315f38':'#284f32';ctx.beginPath();ctx.arc(x,y-s,s*.48,0,Math.PI*2);ctx.fill();if(i%2===0){ctx.fillStyle='#796946';ctx.fillRect(x-s*.5,y-s*.28,s,s*.16);ctx.fillStyle='#f4a735';ctx.beginPath();ctx.arc(x,y-s*.18,s*.1,0,Math.PI*2);ctx.fill()}}
      for(let side of[-1,1])for(let i=0;i<3;i++){const z=(i*.37-(t*.09)%1+1)%1,p=1-z,y=horizon+(H-horizon)*p*p,s=18+p*150,x=roadX(z,0)+side*W*(.4+.33*p);ctx.fillStyle='#71694f';ctx.fillRect(x-s*.12,y-s*.85,s*.24,s*.85);ctx.fillStyle='#393b2d';ctx.fillRect(x-s*.2,y-s*.9,s*.4,s*.12)}
      ctx.fillStyle='rgba(205,225,190,.07)';ctx.fillRect(0,horizon*.82,W,H*.12);
      if(speed>1.35){ctx.strokeStyle=`rgba(225,245,215,${(speed-1)*.1})`;ctx.lineWidth=2;for(let i=0;i<7;i++){const y=(t*420*speed+i*H/7)%H,x=i%2?W*.06:W*.94;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(i%2?-1:1)*W*.06,y+H*.08);ctx.stroke()}}
      if(junction||cornerTurn)drawCorner(horizon);
      const sorted=[...objects].sort((a,b)=>b.z-a.z);for(const o of sorted){const p=1-o.z;if(p<0)continue;const y=horizon+(H-horizon)*p*p,size=14+p*p*120,x=roadX(o.z,o.lane);if(o.type==='milk'){ctx.save();ctx.shadowColor='#75ff9d';ctx.shadowBlur=size*.25;ctx.drawImage(water,x-size*.29,y-size,size*.58,size);ctx.restore()}else if(o.type==='rock'){ctx.fillStyle='#4b4c3d';ctx.strokeStyle='#77785f';ctx.lineWidth=Math.max(2,size*.04);ctx.beginPath();ctx.moveTo(x-size*.45,y);ctx.lineTo(x-size*.34,y-size*.55);ctx.lineTo(x,y-size*.78);ctx.lineTo(x+size*.38,y-size*.48);ctx.lineTo(x+size*.46,y);ctx.closePath();ctx.fill();ctx.stroke()}else if(o.type==='root'){ctx.strokeStyle='#3e2817';ctx.lineWidth=size*.18;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-size*.42,y-size*.05);ctx.quadraticCurveTo(x,y-size*.3,x+size*.42,y-size*.05);ctx.stroke()}else if(o.type==='gap'){ctx.fillStyle='#080b08';ctx.beginPath();ctx.ellipse(x,y-size*.12,size*.48,size*.24,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#9a8352';ctx.lineWidth=Math.max(2,size*.04);ctx.stroke()}else{ctx.fillStyle='#3d2918';ctx.fillRect(x-size*.42,y-size*.82,size*.1,size*.82);ctx.fillRect(x+size*.32,y-size*.82,size*.1,size*.82);ctx.fillStyle='#594025';ctx.fillRect(x-size*.42,y-size*.82,size*.84,size*.18)}}
      const frame=Math.floor(t*11*speed)%8,bob=Math.sin(t*12*speed)*H*.004,j=jump?Math.sin(Math.min(jump,2)*Math.PI/2)*H*.24:0,fh=clamp(H*.28,165,280),fw=fh,fx=W/2+lane*W*.23,fy=H*.9-j+bob;
      const hh=clamp(H*(.16+chase*.1),95,245),hy=H*(1.11-chase*.14),hx=W/2+lane*W*.09;ctx.save();ctx.globalAlpha=.6+chase*.4;ctx.translate(hx,hy);ctx.rotate(Math.sin(t*18)*.025*chase);drawFrame(hunter,(frame+4)%8,0,0,hh,hh);ctx.restore();
      ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(fx,H*.9,fw*.3*(1-j/H),10+j*.03,0,0,Math.PI*2);ctx.fill();ctx.save();ctx.translate(fx,fy+slide*fh*.12);ctx.rotate(turnAnim*.5+(targetLane-lane)*-.16+stumble*Math.sin(t*35)*.2+(slide?-.25:0));if(stumble)ctx.scale(1-stumble*.08,1+stumble*.06);else if(slide)ctx.scale(1.12,.76);else if(jump)ctx.scale(.96,1.04);drawFrame(frog,jump?2:slide?6:frame,0,0,fw,fh);ctx.restore();
      if(chase>.05){const danger=ctx.createRadialGradient(W/2,H*.5,W*.25,W/2,H*.5,H*.75);danger.addColorStop(.55,'#0000');danger.addColorStop(1,`rgba(155,20,10,${chase*.42})`);ctx.fillStyle=danger;ctx.fillRect(0,0,W,H)}
      if(Math.abs(turnAnim)>.02){ctx.strokeStyle=`rgba(255,245,210,${Math.abs(turnAnim)*.45})`;ctx.lineWidth=3;for(let i=0;i<8;i++){const y=H*(.18+i*.09),x=W*(.08+(i%3)*.08);ctx.beginPath();ctx.moveTo(turnAnim>0?x:W-x,y);ctx.lineTo(turnAnim>0?x-W*.18:W-x+W*.18,y+H*.035);ctx.stroke()}}
      const vignette=ctx.createRadialGradient(W/2,H*.48,Math.min(W,H)*.25,W/2,H*.48,Math.max(W,H)*.72);vignette.addColorStop(.55,'#0000');vignette.addColorStop(1,'#0009');ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);ctx.restore()
    }
    function loop(now){if(state!=='play')return;const dt=Math.min(.034,(now-last)/1000);last=now;update(dt,now);draw();if(state==='play')requestAnimationFrame(loop)}
    function selfCheck(){console.assert(clamp(2,-1,1)===1&&clamp(-2,-1,1)===-1,'lane clamp failed');console.assert(roadX(.9,-1)<roadX(.9,0)&&roadX(.9,0)<roadX(.9,1),'far lanes collapsed');console.assert(tiltLane(22,0)===1&&tiltLane(-22,0)===-1&&tiltLane(5,5)===0,'tilt calibration failed');console.assert(patterns.length===5&&lanes.join(',')==='-1,0,1','patterns invalid');console.assert(!obstacleHits('root',true,0)&&!obstacleHits('gap',true,0)&&!obstacleHits('branch',false,1),'avoidance failed')}selfCheck();
    frog.onload=hunter.onload=water.onload=draw;draw();
  </script>
