<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>奶蛙逃亡</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17140d;color:#fff;font-family:system-ui,"Microsoft YaHei",sans-serif}button{font:inherit}
    #game{display:block;width:100%;height:100%;touch-action:none;background:#b9e9ff}
    .hud{position:fixed;inset:0;pointer-events:none;padding:max(18px,env(safe-area-inset-top)) 20px 20px;display:flex;align-items:flex-start;justify-content:space-between;text-shadow:0 2px 4px #0008}
    .score{font-size:clamp(22px,4vw,36px);font-weight:900;line-height:1}.score small{display:block;margin-top:8px;font-size:13px;letter-spacing:2px;color:#fff9ad}.milk{display:flex;align-items:center;gap:7px;font-size:20px;font-weight:800;background:#251c12bb;border:2px solid #f7d553;border-radius:999px;padding:7px 14px}.milk img{width:22px;height:32px;object-fit:contain}
    .screen{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:linear-gradient(#071c2488,#151008dd);text-align:center}.screen[hidden]{display:none}.card{width:min(470px,100%);padding:32px 24px;border:1px solid #fff3;border-radius:28px;background:#20170ee8;box-shadow:0 20px 70px #0008;backdrop-filter:blur(12px)}
    h1{margin:0;font-size:clamp(48px,13vw,78px);line-height:.9;color:#ffdf35;text-shadow:0 5px 0 #8b501b,0 9px 18px #000}.tag{margin:22px 0;color:#f7e9ce;font-weight:700}.tip{margin:18px 0 0;color:#cdbfa9;font-size:14px;line-height:1.8}.start{pointer-events:auto;border:0;border-radius:999px;padding:14px 34px;color:#2a1a0c;background:#ffdc38;font-size:20px;font-weight:900;box-shadow:0 6px 0 #b96a20;cursor:pointer}.start:active{transform:translateY(4px);box-shadow:0 2px 0 #b96a20}.best{margin:12px 0 22px;color:#fff4ba;font-weight:800}
    .controls{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:none;gap:12px;pointer-events:auto}.controls button{width:58px;height:58px;border:1px solid #fff5;border-radius:50%;background:#21180dbb;color:#fff;font-size:26px;backdrop-filter:blur(6px)}
    .calibrate{pointer-events:auto;position:fixed;right:18px;bottom:max(86px,calc(env(safe-area-inset-bottom) + 68px));border:1px solid #fff4;border-radius:999px;padding:8px 12px;background:#17130dbb;color:#fff;font-weight:800}
    @media (pointer:coarse){.controls{display:flex}}
  </style>
</head>
<body>
  <canvas id="game" aria-label="奶蛙逃亡游戏画面"></canvas>
  <div class="hud" id="hud" hidden><div class="score"><span id="score">0</span><small>逃亡积分 · <span id="combo">×1</span></small></div><div class="milk"><img src="assets/cartoon-water-bottle.png" alt="">大水 <span id="milk">0</span></div></div>
  <div class="controls" id="controls"><button data-key="left" aria-label="向左">←</button><button data-key="up" aria-label="跳跃">↑</button><button data-key="down" aria-label="下滑">↓</button><button data-key="right" aria-label="向右">→</button></div>
  <button class="calibrate" id="calibrate" hidden>校准倾斜</button>
  <div class="screen" id="intro"><div class="card"><h1>奶蛙<br>逃亡</h1><p class="tag">别让高雅人士追上你！</p><button class="start" id="start">开始逃亡</button><p class="tip">手机左右倾斜控制位置<br>上滑跳跃 · 下滑俯身 · 左右滑转弯</p></div></div>
  <div class="screen" id="over" hidden><div class="card"><h1>被逮住了</h1><p class="best" id="result"></p><button class="start" id="again">再跑一次</button></div></div>
  <script>
    const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
    const frog=new Image(),hunter=new Image(),water=new Image(); frog.src='assets/milk-frog-run-sheet.png'; hunter.src='assets/gentleman-run-sheet.png'; water.src='assets/cartoon-water-bottle.png';
    const $=s=>document.querySelector(s), hud=$('#hud'), intro=$('#intro'), over=$('#over'), scoreEl=$('#score'), milkEl=$('#milk'),comboEl=$('#combo');
    let W,H,DPR,state='intro',last=0,startTime=0,score=0,bonus=0,milks=0,combo=0,lane=0,targetLane=0,jump=0,slide=0,speed=1,spawn=0,shake=0,chase=0,bend=0,turnCooldown=7,turnAnim=0,junction=null,objects=[],touch=null,tilt=0,tiltCenter=null,tiltActive=false,sensorListening=false;
    const keys=new Set(),rand=n=>Math.floor(Math.random()*n),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
    const tiltLane=(value,center)=>clamp((value-center)/22,-1,1);
    function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
    function readTilt(e){const angle=screen.orientation?.angle??window.orientation??0,value=angle===90?e.beta:angle===270||angle===-90?-e.beta:e.gamma;if(value==null)return;tilt=value;if(tiltCenter==null)tiltCenter=value;tiltActive=true;$('#calibrate').hidden=false}
    async function enableTilt(){if(sensorListening||!('DeviceOrientationEvent'in window))return;try{if(typeof DeviceOrientationEvent.requestPermission==='function'&&await DeviceOrientationEvent.requestPermission()!=='granted')return;addEventListener('deviceorientation',readTilt,true);sensorListening=true}catch(e){console.warn('方向传感器不可用',e)}}
    async function reset(){await enableTilt();tiltCenter=null;state='play';last=performance.now();startTime=last;score=bonus=milks=combo=lane=targetLane=jump=slide=spawn=shake=chase=bend=turnAnim=0;turnCooldown=7;junction=null;speed=1;objects=[];hud.hidden=false;intro.hidden=over.hidden=true;requestAnimationFrame(loop)}
    function action(a){if(state!=='play')return;if((a==='left'||a==='right')&&junction&&junction.z<.42){if(a!==junction.dir)return end('拐错方向，掉进遗迹了');turnAnim=a==='left'?-1:1;junction=null;turnCooldown=7+Math.random()*4;targetLane=0;bonus+=200*Math.max(1,Math.floor(combo/5)+1);return}if(a==='left')targetLane=clamp(targetLane-.38,-1,1);if(a==='right')targetLane=clamp(targetLane+.38,-1,1);if(a==='up'&&!jump){jump=1;slide=0}if(a==='down'&&!slide){slide=1;setTimeout(()=>slide=0,650)}}
    addEventListener('keydown',e=>{const k={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',' ':'up',ArrowDown:'down',s:'down'}[e.key];if(k){e.preventDefault();if(!keys.has(k))action(k);keys.add(k)}});addEventListener('keyup',e=>{const k={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',' ':'up',ArrowDown:'down',s:'down'}[e.key];keys.delete(k)});
    canvas.addEventListener('pointerdown',e=>touch=[e.clientX,e.clientY]);canvas.addEventListener('pointerup',e=>{if(!touch)return;const dx=e.clientX-touch[0],dy=e.clientY-touch[1];action(Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down'));touch=null});
    $('#controls').onclick=e=>e.target.dataset.key&&action(e.target.dataset.key);$('#calibrate').onclick=()=>tiltCenter=tilt;$('#start').onclick=$('#again').onclick=reset;addEventListener('resize',resize);resize();
    function roadX(depth,which){const p=1-depth,half=(W*.08)+(W*.56-W*.08)*p;return W/2+bend*W*.16*depth+which*.29*half*1.75}
    function spawnObject(){const l=rand(3)-1,r=Math.random();if(r<.5){const drift=(rand(3)-1)*.16;for(let i=0;i<5;i++)objects.push({type:'milk',lane:clamp(l+drift*i,-1,1),z:1+i*.1,hit:false})}else objects.push({type:r<.67?'rock':r<.8?'root':r<.92?'branch':'gap',lane:l,z:1,hit:false})}
    function update(dt,now){speed=1+Math.min(1.6,(now-startTime)/65000);score=Math.floor((now-startTime)/55)+bonus;bend=Math.sin(score*.006)*.75;if(!junction||junction.z>.42){if(tiltActive&&tiltCenter!=null)targetLane=tiltLane(tilt,tiltCenter);else{if(keys.has('left'))targetLane-=dt*1.8;if(keys.has('right'))targetLane+=dt*1.8;targetLane=clamp(targetLane,-1,1)}}lane+=(targetLane-lane)*Math.min(1,dt*9);chase=Math.max(0,chase-dt*.16);turnAnim*=Math.max(0,1-dt*5);if(jump){jump+=dt*2.6;if(jump>=2)jump=0}if(!junction){turnCooldown-=dt*speed;if(turnCooldown<=0){junction={dir:Math.random()<.5?'left':'right',z:1};objects=objects.filter(o=>o.z<.5)}}else{junction.z-=dt*.48*speed;if(junction.z<.02)return end('没转弯，冲出了遗迹')}spawn-=dt*speed;if(spawn<=0&&!junction){spawnObject();spawn=.58+Math.random()*.34}for(const o of objects){o.z-=dt*.48*speed;if(o.type==='milk'&&o.z<0&&!o.hit)combo=0;if(o.z<.12&&!o.hit&&Math.abs(lane-o.lane)<.36){const airborne=jump>.22&&jump<1.78;if(o.type==='milk'){milks++;combo++;bonus+=10*Math.max(1,Math.floor(combo/5)+1);o.hit=true}else if(o.type==='rock'||((o.type==='root'||o.type==='gap')&&!airborne)||(o.type==='branch'&&!slide)){o.hit=true;combo=0;shake=22;if(chase>.45)return end('高雅人士抓住了你');chase=1}}}objects=objects.filter(o=>o.z>-.08&&!o.hit);shake*=.84;scoreEl.textContent=score.toLocaleString();milkEl.textContent=milks;comboEl.textContent='×'+Math.max(1,Math.floor(combo/5)+1)}
    function end(reason='高雅人士抓住了你'){state='over';hud.hidden=true;over.hidden=false;const best=Math.max(score,+localStorage.milkFrogBest||0);localStorage.milkFrogBest=best;$('#over h1').textContent=reason;$('#result').textContent=`积分 ${score} · 捡到 ${milks} 瓶大水　最佳 ${best}`}
    function drawSprite(img,sx,sy,sw,sh,x,y,w,h){ctx.save();ctx.beginPath();ctx.roundRect(x-w/2,y-h,w,h,w*.18);ctx.clip();ctx.drawImage(img,sx,sy,sw,sh,x-w/2,y-h,w,h);ctx.restore()}
    function drawFrame(img,frame,x,y,w,h){if(!img.naturalWidth)return;const sw=img.naturalWidth/4,sh=img.naturalHeight/2;ctx.drawImage(img,(frame%4)*sw,Math.floor(frame/4)*sh,sw,sh,x-w/2,y-h,w,h)}
    function draw(){
      ctx.save();ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);const t=performance.now()/1000,horizon=H*.26;
      const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#082b2b');sky.addColorStop(.34,'#46795a');sky.addColorStop(1,'#172518');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#f7c65a44';ctx.beginPath();ctx.arc(W/2,horizon*.7,W*.18,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#153d2d';for(let i=0;i<10;i++){const x=i*W/9,r=W*(.06+(i%3)*.02);ctx.beginPath();ctx.arc(x,horizon,r,0,Math.PI*2);ctx.fill()}
      const far=W/2+bend*W*.16;ctx.fillStyle='#263b27';ctx.beginPath();ctx.moveTo(far-W*.1,horizon);ctx.lineTo(W*.04,H);ctx.lineTo(W*.96,H);ctx.lineTo(far+W*.1,horizon);ctx.fill();
      const floor=ctx.createLinearGradient(0,horizon,0,H);floor.addColorStop(0,'#82754f');floor.addColorStop(1,'#403c2a');ctx.fillStyle=floor;ctx.beginPath();ctx.moveTo(far-W*.07,horizon);ctx.lineTo(W*.08,H);ctx.lineTo(W*.92,H);ctx.lineTo(far+W*.07,horizon);ctx.fill();
      for(let i=0;i<13;i++){const z=(i/13+(t*speed*.22)%1)%1,p=1-z,y=horizon+(H-horizon)*p*p,half=W*(.07+.39*p),cx=W/2+bend*W*.16*z;ctx.strokeStyle=`rgba(215,190,125,${.08+p*.2})`;ctx.lineWidth=1+p*4;ctx.beginPath();ctx.moveTo(cx-half,y);ctx.lineTo(cx+half,y);ctx.stroke()}
      for(let side of[-1,1])for(let i=0;i<5;i++){const z=(i*.23+(t*.13)%1)%1,p=1-z,y=horizon+(H-horizon)*p*p,s=14+p*105,x=W/2+side*(W*(.1+.52*p));ctx.fillStyle='#142c20';ctx.fillRect(x-s*.13,y-s,s*.26,s);ctx.fillStyle='#315f38';ctx.beginPath();ctx.arc(x,y-s,s*.48,0,Math.PI*2);ctx.fill();if(i%2===0){ctx.fillStyle='#796946';ctx.fillRect(x-s*.5,y-s*.28,s,s*.16);ctx.fillStyle='#f4a735';ctx.beginPath();ctx.arc(x,y-s*.18,s*.1,0,Math.PI*2);ctx.fill()}}
      if(junction){const p=1-junction.z;if(p>0){const y=horizon+(H-horizon)*p*p,s=24+p*p*150,x=roadX(junction.z,0);ctx.fillStyle='#261f17';ctx.fillRect(x-s*1.35,y-s*.72,s*2.7,s*.72);ctx.strokeStyle='#a9894d';ctx.lineWidth=Math.max(2,s*.035);ctx.strokeRect(x-s*1.35,y-s*.72,s*2.7,s*.72);ctx.save();ctx.translate(x,y-s*.36);ctx.fillStyle=junction.z<.42?'#ffdf4a':'#fff2b4';ctx.shadowColor='#ffb126';ctx.shadowBlur=18;ctx.font=`900 ${s*.56}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(junction.dir==='left'?'←':'→',0,0);ctx.restore()}}
      const sorted=[...objects].sort((a,b)=>b.z-a.z);for(const o of sorted){const p=1-o.z;if(p<0)continue;const y=horizon+(H-horizon)*p*p,size=14+p*p*120,x=roadX(o.z,o.lane);if(o.type==='milk'){ctx.save();ctx.shadowColor='#75ff9d';ctx.shadowBlur=size*.25;ctx.drawImage(water,x-size*.29,y-size,size*.58,size);ctx.restore()}else if(o.type==='rock'){ctx.fillStyle='#4b4c3d';ctx.strokeStyle='#77785f';ctx.lineWidth=Math.max(2,size*.04);ctx.beginPath();ctx.moveTo(x-size*.55,y);ctx.lineTo(x-size*.4,y-size*.55);ctx.lineTo(x,y-size*.78);ctx.lineTo(x+size*.48,y-size*.48);ctx.lineTo(x+size*.58,y);ctx.closePath();ctx.fill();ctx.stroke()}else if(o.type==='root'){ctx.strokeStyle='#3e2817';ctx.lineWidth=size*.22;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-size*.58,y-size*.05);ctx.quadraticCurveTo(x,y-size*.35,x+size*.58,y-size*.05);ctx.stroke()}else if(o.type==='gap'){ctx.fillStyle='#080b08';ctx.beginPath();ctx.ellipse(x,y-size*.12,size*.72,size*.28,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#9a8352';ctx.lineWidth=Math.max(2,size*.04);ctx.stroke()}else{ctx.fillStyle='#3d2918';ctx.fillRect(x-size*.75,y-size*.82,size*.13,size*.82);ctx.fillRect(x+size*.62,y-size*.82,size*.13,size*.82);ctx.fillStyle='#594025';ctx.fillRect(x-size*.75,y-size*.82,size*1.5,size*.22)}}
      const frame=Math.floor(t*11*speed)%8,bob=Math.sin(t*12*speed)*H*.004,j=jump?Math.sin(Math.min(jump,2)*Math.PI/2)*H*.17:0,fh=clamp(H*.28,165,280),fw=fh,fx=W/2+lane*W*.23,fy=H*.9-j+bob;
      const hh=clamp(H*(.18+chase*.09),105,245),hy=H*(1.11-chase*.16);ctx.save();ctx.globalAlpha=.72+chase*.28;drawFrame(hunter,(frame+4)%8,W/2,hy,hh,hh);ctx.restore();
      ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(fx,H*.9,fw*.3*(1-j/H),10+j*.03,0,0,Math.PI*2);ctx.fill();ctx.save();ctx.translate(fx,fy);ctx.rotate((targetLane-lane)*-.16);drawFrame(frog,frame,0,0,fw,slide?fh*.56:fh);ctx.restore();
      if(Math.abs(turnAnim)>.02){ctx.fillStyle=`rgba(255,225,132,${Math.abs(turnAnim)*.2})`;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#fff8';ctx.lineWidth=6;for(let i=0;i<7;i++){const y=H*(.2+i*.11);ctx.beginPath();ctx.moveTo(W/2,y);ctx.lineTo(W/2+turnAnim*W*.55,y);ctx.stroke()}}
      const vignette=ctx.createRadialGradient(W/2,H*.48,Math.min(W,H)*.25,W/2,H*.48,Math.max(W,H)*.72);vignette.addColorStop(.55,'#0000');vignette.addColorStop(1,'#0009');ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);ctx.restore()
    }
    function loop(now){if(state!=='play')return;const dt=Math.min(.034,(now-last)/1000);last=now;update(dt,now);draw();if(state==='play')requestAnimationFrame(loop)}
    function selfCheck(){console.assert(clamp(2,-1,1)===1&&clamp(-2,-1,1)===-1,'lane clamp failed');console.assert(roadX(0,-1)<roadX(0,0)&&roadX(0,0)<roadX(0,1),'lane order failed');console.assert(tiltLane(22,0)===1&&tiltLane(-22,0)===-1&&tiltLane(5,5)===0,'tilt calibration failed')}selfCheck();
    frog.onload=hunter.onload=water.onload=draw;draw();
  </script>
</body>
</html>
