<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>奶蛙逃亡</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17140d;color:#fff;font-family:system-ui,"Microsoft YaHei",sans-serif}button{font:inherit}
    #game{display:block;width:100%;height:100%;touch-action:none;background:#b9e9ff}
    .hud{position:fixed;inset:0;pointer-events:none;padding:max(18px,env(safe-area-inset-top)) 20px 20px;display:flex;align-items:flex-start;justify-content:space-between;text-shadow:0 2px 4px #0008}
    .score{font-size:clamp(22px,4vw,36px);font-weight:900;line-height:1}.score small{display:block;margin-top:8px;font-size:13px;letter-spacing:2px;color:#fff9ad}.milk{display:flex;align-items:center;gap:7px;font-size:20px;font-weight:800;background:#251c12bb;border:2px solid #f7d553;border-radius:999px;padding:7px 14px}.milk img{width:22px;height:32px;object-fit:contain}
    .screen{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:linear-gradient(#071c2488,#151008dd);text-align:center}.screen[hidden]{display:none}.card{width:min(470px,100%);padding:32px 24px;border:1px solid #fff3;border-radius:28px;background:#20170ee8;box-shadow:0 20px 70px #0008;backdrop-filter:blur(12px)}
    h1{margin:0;font-size:clamp(48px,13vw,78px);line-height:.9;color:#ffdf35;text-shadow:0 5px 0 #8b501b,0 9px 18px #000}.tag{margin:22px 0;color:#f7e9ce;font-weight:700}.tip{margin:18px 0 0;color:#cdbfa9;font-size:14px;line-height:1.8}.start{pointer-events:auto;border:0;border-radius:999px;padding:14px 34px;color:#2a1a0c;background:#ffdc38;font-size:20px;font-weight:900;box-shadow:0 6px 0 #b96a20;cursor:pointer}.start:active{transform:translateY(4px);box-shadow:0 2px 0 #b96a20}.best{margin:12px 0 22px;color:#fff4ba;font-weight:800}
    .controls{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:none;gap:12px;pointer-events:auto}.controls button{width:58px;height:58px;border:1px solid #fff5;border-radius:50%;background:#21180dbb;color:#fff;font-size:26px;backdrop-filter:blur(6px)}
    .calibrate{pointer-events:auto;position:fixed;right:18px;bottom:max(86px,calc(env(safe-area-inset-bottom) + 68px));border:1px solid #fff4;border-radius:999px;padding:8px 12px;background:#17130dbb;color:#fff;font-weight:800}
    @media (pointer:coarse){body.sensor-fallback .controls{display:flex}}
  </style>
</head>
<body>
  <canvas id="game" aria-label="奶蛙逃亡游戏画面"></canvas>
  <div class="hud" id="hud" hidden><div class="score"><span id="score">0</span><small>逃亡积分 · <span id="combo">×1</span></small></div><div class="milk"><img src="assets/cartoon-water-bottle.png" alt="">大水 <span id="milk">0</span></div></div>
  <div class="controls" id="controls"><button data-key="left" aria-label="向左">←</button><button data-key="up" aria-label="跳跃">↑</button><button data-key="down" aria-label="下滑">↓</button><button data-key="right" aria-label="向右">→</button></div>
  <button class="calibrate" id="calibrate" hidden>校准倾斜</button>
  <div class="screen" id="intro"><div class="card"><h1>奶蛙<br>逃亡</h1><p class="tag">别让高雅人士追上你！</p><button class="start" id="start">开始逃亡</button><p class="tip">手机左右倾斜控制位置<br>上滑跳跃 · 下滑俯身 · 左右滑转弯</p></div></div>
  <div class="screen" id="over" hidden><div class="card"><h1>被逮住了</h1><p class="best" id="result"></p><button class="start" id="again">再跑一次</button></div></div>
  <script>
    const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
    const frog=new Image(),hunter=new Image(),water=new Image(); frog.src='assets/milk-frog-run-sheet.png'; hunter.src='assets/gentleman-run-sheet.png'; water.src='assets/cartoon-water-bottle.png';
    const $=s=>document.querySelector(s), hud=$('#hud'), intro=$('#intro'), over=$('#over'), scoreEl=$('#score'), milkEl=$('#milk'),comboEl=$('#combo');
    let W,H,DPR,state='intro',last=0,startTime=0,score=0,bonus=0,milks=0,combo=0,lane=0,targetLane=0,jump=0,slide=0,stumble=0,speed=1,spawn=0,shake=0,chase=0,bend=0,turnCooldown=7,turnAnim=0,junction=null,objects=[],touch=null,tilt=0,tiltCenter=null,tiltActive=false,sensorListening=false,patternIndex=0,audio;
    const keys=new Set(),rand=n=>Math.floor(Math.random()*n),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
    const tiltLane=(value,center)=>{const d=value-center,a=Math.abs(d);return a<3?0:clamp(Math.sign(d)*(a-3)/17,-1,1)};
    function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
    function readTilt(e){const angle=screen.orientation?.angle??window.orientation??0,value=angle===90?e.beta:angle===270||angle===-90?-e.beta:e.gamma;if(value==null)return;tilt=value;if(tiltCenter==null)tiltCenter=value;tiltActive=true;$('#calibrate').hidden=false}
    async function enableTilt(){if(sensorListening)return true;if(!('DeviceOrientationEvent'in window))return false;try{if(typeof DeviceOrientationEvent.requestPermission==='function'&&await DeviceOrientationEvent.requestPermission()!=='granted')return false;addEventListener('deviceorientation',readTilt,true);sensorListening=true;return true}catch(e){console.warn('方向传感器不可用',e);return false}}
    function sound(freq,duration=.07,volume=.025){try{const AC=window.AudioContext||window.webkitAudioContext;audio??=new AC();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+duration);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}}
    async function reset(){const hasSensor=await enableTilt();document.body.classList.toggle('sensor-fallback',!hasSensor);tiltCenter=null;state='play';last=performance.now();startTime=last;score=bonus=milks=combo=lane=targetLane=jump=slide=stumble=spawn=shake=chase=bend=turnAnim=patternIndex=0;turnCooldown=7;junction=null;speed=1;objects=[];hud.hidden=false;intro.hidden=over.hidden=true;requestAnimationFrame(loop)}
    function action(a){if(state!=='play')return;if((a==='left'||a==='right')&&junction&&junction.z<.42){if(a!==junction.dir)return end('拐错方向，掉进遗迹了');turnAnim=a==='left'?-1:1;junction=null;turnCooldown=7+Math.random()*4;targetLane=0;bonus+=200*Math.max(1,Math.floor(combo/5)+1);sound(180,.12,.04);navigator.vibrate?.(30);return}if(a==='left')targetLane=clamp(targetLane-.38,-1,1);if(a==='right')targetLane=clamp(targetLane+.38,-1,1);if(a==='up'&&!jump){jump=1;slide=0;sound(330)}if(a==='down'&&!slide){slide=1;setTimeout(()=>slide=0,650)}}
    addEventListener('keydown',e=>{const k={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',' ':'up',ArrowDown:'down',s:'down'}[e.key];if(k){e.preventDefault();if(!keys.has(k))action(k);keys.add(k)}});addEventListener('keyup',e=>{const k={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',' ':'up',ArrowDown:'down',s:'down'}[e.key];keys.delete(k)});
    canvas.addEventListener('pointerdown',e=>touch=[e.clientX,e.clientY]);canvas.addEventListener('pointerup',e=>{if(!touch)return;const dx=e.clientX-touch[0],dy=e.clientY-touch[1];action(Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down'));touch=null});
    $('#controls').onclick=e=>e.target.dataset.key&&action(e.target.dataset.key);$('#calibrate').onclick=()=>tiltCenter=tilt;$('#start').onclick=$('#again').onclick=reset;addEventListener('resize',resize);addEventListener('orientationchange',()=>tiltCenter=null);resize();
    function roadX(depth,which){const p=1-depth,half=W*(.15+.41*p);return W/2+(bend*.16+turnAnim*.52)*W*depth+which*.5*half}
    const patterns=[
      [{type:'rock',lane:-1,z:1},{type:'rock',lane:0,z:1},{type:'milk',lane:1,z:1.02},{type:'milk',lane:1,z:1.15},{type:'milk',lane:1,z:1.28}],
      [{type:'root',lane:0,z:1},{type:'milk',lane:0,z:1.08},{type:'milk',lane:0,z:1.2},{type:'milk',lane:0,z:1.32}],
      [{type:'branch',lane:-1,z:1},{type:'branch',lane:1,z:1},{type:'milk',lane:0,z:1.04},{type:'milk',lane:0,z:1.17},{type:'milk',lane:0,z:1.3}],
      [{type:'gap',lane:0,z:1},{type:'milk',lane:-1,z:1.03},{type:'milk',lane:-1,z:1.16},{type:'milk',lane:-1,z:1.29}],
      [{type:'rock',lane:-1,z:1},{type:'milk',lane:0,z:1.02},{type:'milk',lane:1,z:1.16},{type:'rock',lane:0,z:1.34}]
    ];
    function spawnObject(){const pattern=patterns[patternIndex++%patterns.length],mirror=Math.random()<.5?-1:1;for(const o of pattern)objects.push({...o,lane:o.lane*mirror,hit:false})}
    function update(dt,now){speed=1+Math.min(1.6,(now-startTime)/65000);score=Math.floor((now-startTime)/55)+bonus;bend=Math.sin(score*.006)*.75;if(!junction||junction.z>.42){if(tiltActive&&tiltCenter!=null)targetLane+=(tiltLane(tilt,tiltCenter)-targetLane)*Math.min(1,dt*10);else{if(keys.has('left'))targetLane-=dt*1.8;if(keys.has('right'))targetLane+=dt*1.8;targetLane=clamp(targetLane,-1,1)}}lane+=(targetLane-lane)*Math.min(1,dt*9);chase=Math.max(0,chase-dt*.16);stumble=Math.max(0,stumble-dt*2.4);turnAnim*=Math.max(0,1-dt*2.8);if(jump){jump+=dt*2.6;if(jump>=2){jump=0;shake=Math.max(shake,4);navigator.vibrate?.(12)}}if(!junction){turnCooldown-=dt*speed;if(turnCooldown<=0){junction={dir:Math.random()<.5?'left':'right',z:1};objects=objects.filter(o=>o.z<.5)}}else{junction.z-=dt*.48*speed;if(junction.z<.02)return end('没转弯，冲出了遗迹')}spawn-=dt*speed;if(spawn<=0&&!junction){spawnObject();spawn=1.15+Math.random()*.28}for(const o of objects){o.z-=dt*.48*speed;if(o.type==='milk'&&o.z<0&&!o.hit)combo=0;if(o.z<.12&&!o.hit&&Math.abs(lane-o.lane)<.36){const airborne=jump>.22&&jump<1.78;if(o.type==='milk'){milks++;combo++;bonus+=10*Math.max(1,Math.floor(combo/5)+1);o.hit=true;sound(620+Math.min(combo,8)*35,.05,.018);navigator.vibrate?.(8)}else if(o.type==='rock'||((o.type==='root'||o.type==='gap')&&!airborne)||(o.type==='branch'&&!slide)){o.hit=true;combo=0;shake=22;stumble=1;sound(75,.18,.06);navigator.vibrate?.([70,30,70]);if(chase>.45)return end('高雅人士抓住了你');chase=1}}}objects=objects.filter(o=>o.z>-.08&&!o.hit);shake*=.84;scoreEl.textContent=score.toLocaleString();milkEl.textContent=milks;comboEl.textContent='×'+Math.max(1,Math.floor(combo/5)+1)}
    function end(reason='高雅人士抓住了你'){state='over';hud.hidden=true;over.hidden=false;const best=Math.max(score,+localStorage.milkFrogBest||0);localStorage.milkFrogBest=best;$('#over h1').textContent=reason;$('#result').textContent=`积分 ${score} · 捡到 ${milks} 瓶大水　最佳 ${best}`}
    function drawSprite(img,sx,sy,sw,sh,x,y,w,h){ctx.save();ctx.beginPath();ctx.roundRect(x-w/2,y-h,w,h,w*.18);ctx.clip();ctx.drawImage(img,sx,sy,sw,sh,x-w/2,y-h,w,h);ctx.restore()}
    function drawFrame(img,frame,x,y,w,h){if(!img.naturalWidth)return;const sw=img.naturalWidth/4,sh=img.naturalHeight/2;ctx.drawImage(img,(frame%4)*sw,Math.floor(frame/4)*sh,sw,sh,x-w/2,y-h,w,h)}
    function draw(){
      const t=performance.now()/1000,horizon=H*(.26-(speed-1)*.012);ctx.save();ctx.translate((Math.random()-.5)*shake,Math.sin(t*12*speed)*H*.0015+(Math.random()-.5)*shake);
      const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#082b2b');sky.addColorStop(.34,'#46795a');sky.addColorStop(1,'#172518');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#f7c65a44';ctx.beginPath();ctx.arc(W/2,horizon*.7,W*.18,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#214b35';for(let i=0;i<13;i++){const x=i*W/12+(bend+turnAnim)*W*.025,r=W*(.035+(i%3)*.012);ctx.beginPath();ctx.arc(x,horizon*.86,r,0,Math.PI*2);ctx.fill()}
      ctx.fillStyle='#153d2d';for(let i=0;i<10;i++){const x=i*W/9+(bend+turnAnim)*W*.055,r=W*(.06+(i%3)*.02);ctx.beginPath();ctx.arc(x,horizon,r,0,Math.PI*2);ctx.fill()}
      const far=W/2+(bend*.16+turnAnim*.52)*W;ctx.fillStyle='#263b27';ctx.beginPath();ctx.moveTo(far-W*.18,horizon);ctx.lineTo(W*.04,H);ctx.lineTo(W*.96,H);ctx.lineTo(far+W*.18,horizon);ctx.fill();
      const floor=ctx.createLinearGradient(0,horizon,0,H);floor.addColorStop(0,'#82754f');floor.addColorStop(1,'#403c2a');ctx.fillStyle=floor;ctx.beginPath();ctx.moveTo(far-W*.145,horizon);ctx.lineTo(W*.08,H);ctx.lineTo(W*.92,H);ctx.lineTo(far+W*.145,horizon);ctx.fill();
      for(let i=0;i<13;i++){const z=(i/13+(t*speed*.22)%1)%1,p=1-z,y=horizon+(H-horizon)*p*p,half=W*(.07+.39*p),cx=roadX(z,0);ctx.strokeStyle=`rgba(215,190,125,${.08+p*.2})`;ctx.lineWidth=1+p*4;ctx.beginPath();ctx.moveTo(cx-half,y);ctx.lineTo(cx+half,y);ctx.stroke()}
      for(let side of[-1,1])for(let i=0;i<6;i++){const z=(i*.19+(t*.13)%1)%1,p=1-z,y=horizon+(H-horizon)*p*p,s=12+p*118,x=roadX(z,0)+side*(W*(.2+.48*p));ctx.fillStyle='#142c20';ctx.fillRect(x-s*.13,y-s,s*.26,s);ctx.fillStyle=i%3?'#315f38':'#284f32';ctx.beginPath();ctx.arc(x,y-s,s*.48,0,Math.PI*2);ctx.fill();if(i%2===0){ctx.fillStyle='#796946';ctx.fillRect(x-s*.5,y-s*.28,s,s*.16);ctx.fillStyle='#f4a735';ctx.beginPath();ctx.arc(x,y-s*.18,s*.1,0,Math.PI*2);ctx.fill()}}
      for(let side of[-1,1])for(let i=0;i<3;i++){const z=(i*.37+(t*.09)%1)%1,p=1-z,y=horizon+(H-horizon)*p*p,s=18+p*150,x=roadX(z,0)+side*W*(.31+.42*p);ctx.fillStyle='#71694f';ctx.fillRect(x-s*.12,y-s*.85,s*.24,s*.85);ctx.fillStyle='#393b2d';ctx.fillRect(x-s*.2,y-s*.9,s*.4,s*.12)}
      ctx.fillStyle='rgba(205,225,190,.07)';ctx.fillRect(0,horizon*.82,W,H*.12);
      if(speed>1.35){ctx.strokeStyle=`rgba(225,245,215,${(speed-1)*.1})`;ctx.lineWidth=2;for(let i=0;i<7;i++){const y=(t*420*speed+i*H/7)%H,x=i%2?W*.06:W*.94;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(i%2?-1:1)*W*.06,y+H*.08);ctx.stroke()}}
      if(junction){const p=1-junction.z;if(p>0){const y=horizon+(H-horizon)*p*p,s=28+p*p*180,x=roadX(junction.z,0),d=junction.dir==='left'?-1:1;ctx.fillStyle='#403c2a';ctx.beginPath();ctx.moveTo(x-s*.72,y);ctx.lineTo(x+s*.72,y);ctx.lineTo(x+d*W*.72,y-s*.62);ctx.lineTo(x+d*W*.72,y-s*1.12);ctx.lineTo(x-d*s*.15,y-s*.42);ctx.closePath();ctx.fill();ctx.strokeStyle='#a9894d';ctx.lineWidth=Math.max(2,s*.035);ctx.stroke();ctx.save();ctx.translate(x+d*s*.18,y-s*.46);ctx.fillStyle=junction.z<.42?'#ffdf4a':'#fff2b4';ctx.shadowColor='#ffb126';ctx.shadowBlur=18;ctx.font=`900 ${s*.48}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(d<0?'←':'→',0,0);ctx.restore()}}
      const sorted=[...objects].sort((a,b)=>b.z-a.z);for(const o of sorted){const p=1-o.z;if(p<0)continue;const y=horizon+(H-horizon)*p*p,size=14+p*p*120,x=roadX(o.z,o.lane);if(o.type==='milk'){ctx.save();ctx.shadowColor='#75ff9d';ctx.shadowBlur=size*.25;ctx.drawImage(water,x-size*.29,y-size,size*.58,size);ctx.restore()}else if(o.type==='rock'){ctx.fillStyle='#4b4c3d';ctx.strokeStyle='#77785f';ctx.lineWidth=Math.max(2,size*.04);ctx.beginPath();ctx.moveTo(x-size*.55,y);ctx.lineTo(x-size*.4,y-size*.55);ctx.lineTo(x,y-size*.78);ctx.lineTo(x+size*.48,y-size*.48);ctx.lineTo(x+size*.58,y);ctx.closePath();ctx.fill();ctx.stroke()}else if(o.type==='root'){ctx.strokeStyle='#3e2817';ctx.lineWidth=size*.22;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-size*.58,y-size*.05);ctx.quadraticCurveTo(x,y-size*.35,x+size*.58,y-size*.05);ctx.stroke()}else if(o.type==='gap'){ctx.fillStyle='#080b08';ctx.beginPath();ctx.ellipse(x,y-size*.12,size*.72,size*.28,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#9a8352';ctx.lineWidth=Math.max(2,size*.04);ctx.stroke()}else{ctx.fillStyle='#3d2918';ctx.fillRect(x-size*.75,y-size*.82,size*.13,size*.82);ctx.fillRect(x+size*.62,y-size*.82,size*.13,size*.82);ctx.fillStyle='#594025';ctx.fillRect(x-size*.75,y-size*.82,size*1.5,size*.22)}}
      const frame=Math.floor(t*11*speed)%8,bob=Math.sin(t*12*speed)*H*.004,j=jump?Math.sin(Math.min(jump,2)*Math.PI/2)*H*.17:0,fh=clamp(H*.28,165,280),fw=fh,fx=W/2+lane*W*.23,fy=H*.9-j+bob;
      const hh=clamp(H*(.16+chase*.1),95,245),hy=H*(1.11-chase*.14),hx=W/2+lane*W*.09;ctx.save();ctx.globalAlpha=.6+chase*.4;ctx.translate(hx,hy);ctx.rotate(Math.sin(t*18)*.025*chase);drawFrame(hunter,(frame+4)%8,0,0,hh,hh);ctx.restore();
      ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(fx,H*.9,fw*.3*(1-j/H),10+j*.03,0,0,Math.PI*2);ctx.fill();ctx.save();ctx.translate(fx,fy+slide*fh*.12);ctx.rotate((targetLane-lane)*-.16+stumble*Math.sin(t*35)*.2+(slide?-.25:0));if(stumble)ctx.scale(1-stumble*.08,1+stumble*.06);else if(slide)ctx.scale(1.12,.76);else if(jump)ctx.scale(.96,1.04);drawFrame(frog,jump?2:slide?6:frame,0,0,fw,fh);ctx.restore();
      if(chase>.05){const danger=ctx.createRadialGradient(W/2,H*.5,W*.25,W/2,H*.5,H*.75);danger.addColorStop(.55,'#0000');danger.addColorStop(1,`rgba(155,20,10,${chase*.42})`);ctx.fillStyle=danger;ctx.fillRect(0,0,W,H)}
      if(Math.abs(turnAnim)>.02){ctx.strokeStyle=`rgba(255,245,210,${Math.abs(turnAnim)*.45})`;ctx.lineWidth=3;for(let i=0;i<8;i++){const y=H*(.18+i*.09),x=W*(.08+(i%3)*.08);ctx.beginPath();ctx.moveTo(turnAnim>0?x:W-x,y);ctx.lineTo(turnAnim>0?x-W*.18:W-x+W*.18,y+H*.035);ctx.stroke()}}
      const vignette=ctx.createRadialGradient(W/2,H*.48,Math.min(W,H)*.25,W/2,H*.48,Math.max(W,H)*.72);vignette.addColorStop(.55,'#0000');vignette.addColorStop(1,'#0009');ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);ctx.restore()
    }
    function loop(now){if(state!=='play')return;const dt=Math.min(.034,(now-last)/1000);last=now;update(dt,now);draw();if(state==='play')requestAnimationFrame(loop)}
    function selfCheck(){console.assert(clamp(2,-1,1)===1&&clamp(-2,-1,1)===-1,'lane clamp failed');console.assert(roadX(.9,-1)<roadX(.9,0)&&roadX(.9,0)<roadX(.9,1),'far lanes collapsed');console.assert(tiltLane(22,0)===1&&tiltLane(-22,0)===-1&&tiltLane(5,5)===0,'tilt calibration failed');console.assert(patterns.length===5&&patterns.every(p=>p.some(o=>o.type==='milk')),'patterns invalid')}selfCheck();
    frog.onload=hunter.onload=water.onload=draw;draw();
  </script>
</body>
</html>
